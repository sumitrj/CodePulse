[project]
name = "codepulse"
version = "0.4.0"
description = "A live map of your repo, for you and your AI coding agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.urls]
Homepage = "https://github.com/sumitrj/CodePulse"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
codepulse = "codepulse.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["codepulse"]
# recipes/*.yml and skill/SKILL.md live inside the package, so they ship as
# package data automatically — no force-include needed.
