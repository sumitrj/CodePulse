<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodePulse</title>
<style>
  :root {
    --primary: #a8c7fa; --on-primary: #062e6f; --primary-container: #284777;
    --on-primary-container: #d6e2ff;
    --secondary-container: #3f4759; --on-secondary-container: #dbe2f9;
    --tertiary: #ebb8dd; --error: #ffb4ab; --error-container: #93000a;
    --surface: #101418; --surface-c-low: #191c20; --surface-c: #1d2024;
    --surface-c-high: #272a2f; --surface-c-highest: #32353a;
    --on-surface: #e2e2e9; --on-surface-var: #c4c6d0; --outline: #8e9099;
    --outline-var: #44474e;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--surface); color: var(--on-surface);
    font: 400 14px/1.5 "Google Sans Text", Roboto, system-ui, sans-serif;
    display: flex; height: 100vh; overflow: hidden;
  }
  /* type scale */
  .display  { font-size: 45px; line-height: 52px; font-weight: 400; }
  .headline { font-size: 24px; line-height: 32px; font-weight: 400; }
  .title    { font-size: 16px; line-height: 24px; font-weight: 500; }
  .label    { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .5px; }
  .body-s   { font-size: 12px; color: var(--on-surface-var); }
  code, .mono { font-family: "Roboto Mono", ui-monospace, monospace; font-size: 12.5px; }

  /* navigation rail */
  nav {
    width: 88px; padding: 12px 0; background: var(--surface);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    border-right: 1px solid var(--outline-var); flex-shrink: 0;
  }
  nav .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--primary-container);
    display: grid; place-items: center; color: var(--on-primary-container); font-weight: 700; margin-bottom: 12px; }
  nav button {
    width: 72px; border: 0; background: none; color: var(--on-surface-var);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; font: inherit; padding: 0;
  }
  nav button .pill { width: 56px; height: 32px; border-radius: 16px; display: grid; place-items: center;
    transition: background .15s; }
  nav button:hover .pill { background: var(--surface-c-high); }
  nav button.active .pill { background: var(--secondary-container); color: var(--on-secondary-container); }
  nav button.active { color: var(--on-surface); }
  nav svg { width: 22px; height: 22px; fill: currentColor; }

  main { flex: 1; overflow-y: auto; padding: 24px 28px 64px; }
  .appbar { display: flex; align-items: baseline; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .appbar .root-path { color: var(--on-surface-var); }

  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card {
    background: var(--surface-c); border-radius: 16px; padding: 18px 20px;
    box-shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  .card.filled { background: var(--surface-c-high); }
  .card h3 { margin-bottom: 10px; }
  .stat-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat {
    background: var(--primary-container); color: var(--on-primary-container);
    border-radius: 16px; padding: 14px 22px; min-width: 130px;
  }
  .stat .n { font-size: 32px; font-weight: 500; line-height: 1.2; }

  .bar { height: 8px; border-radius: 4px; background: var(--surface-c-highest); overflow: hidden; margin-top: 3px; }
  .bar > i { display: block; height: 100%; background: var(--primary); border-radius: 4px; }
  .rowline { padding: 7px 0; border-bottom: 1px solid var(--outline-var); cursor: pointer; }
  .rowline:last-child { border-bottom: 0; }
  .rowline:hover { background: var(--surface-c-high); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 8px; }

  .chip {
    display: inline-flex; align-items: center; height: 26px; padding: 0 12px;
    border-radius: 8px; border: 1px solid var(--outline-var); font-size: 12px; font-weight: 500;
    color: var(--on-surface-var); margin: 2px 4px 2px 0; background: var(--surface-c-low);
  }
  .chip.major   { background: var(--error-container); color: var(--error); border-color: transparent; }
  .chip.removed { background: var(--error-container); color: var(--error); border-color: transparent; }
  .chip.minor   { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }
  .chip.patch, .chip.refactor { color: var(--on-surface-var); }
  .chip.new     { background: var(--primary-container); color: var(--on-primary-container); border-color: transparent; }

  .field { display: flex; gap: 10px; margin-bottom: 18px; }
  .field input {
    flex: 1; max-width: 520px; background: var(--surface-c-high); border: 1px solid var(--outline);
    border-radius: 28px; height: 48px; padding: 0 22px; color: var(--on-surface); font: inherit; outline: none;
  }
  .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .btn {
    height: 48px; padding: 0 24px; border-radius: 24px; border: 0; cursor: pointer;
    background: var(--primary); color: var(--on-primary); font: 500 14px/1 inherit;
  }
  .btn.tonal { background: var(--secondary-container); color: var(--on-secondary-container); }

  #ripple-svg text { fill: var(--on-surface-var); font-size: 10.5px; font-family: "Roboto Mono", monospace; }
  #ripple-svg .ring { fill: none; stroke: var(--outline-var); stroke-dasharray: 3 5; }
  #ripple-svg .node { fill: var(--primary); }
  #ripple-svg .core { fill: var(--tertiary); }
  .spinner { color: var(--on-surface-var); padding: 24px 0; }
  .muted { color: var(--outline); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  /* settings controls */
  .setting { padding: 14px 0; border-bottom: 1px solid var(--outline-var); }
  .setting:last-child { border-bottom: 0; }
  .setting .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .setting .k { font-weight: 500; }
  .setting .help { color: var(--on-surface-var); font-size: 12.5px; margin-top: 2px; }
  .setting .disp { color: var(--outline); font-size: 11px; font-style: italic; }
  .owner-tag { font-size: 11px; color: var(--on-surface-var); background: var(--surface-c-low);
    border: 1px solid var(--outline-var); border-radius: 6px; padding: 1px 8px; margin-left: 8px; }
  /* switch */
  .switch { position: relative; width: 52px; height: 32px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .track { position: absolute; inset: 0; border-radius: 16px; background: var(--surface-c-highest);
    border: 2px solid var(--outline); cursor: pointer; transition: .18s; }
  .thumb { position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%;
    background: var(--outline); transition: .18s; }
  .switch input:checked + .track { background: var(--primary); border-color: var(--primary); }
  .switch input:checked + .track .thumb { left: 26px; top: 6px; width: 20px; height: 20px; background: var(--on-primary); }
  /* slider */
  .slider { display: flex; align-items: center; gap: 12px; min-width: 220px; }
  .slider input[type=range] { flex: 1; accent-color: var(--primary); height: 4px; }
  .slider .val { min-width: 34px; text-align: right; font-weight: 500; color: var(--primary); }
  /* select */
  select { background: var(--surface-c-high); color: var(--on-surface); border: 1px solid var(--outline);
    border-radius: 8px; height: 40px; padding: 0 12px; font: inherit; }
  /* editable chips */
  .chipbox { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip.rm { cursor: pointer; }
  .chip.rm:hover { background: var(--error-container); color: var(--error); border-color: transparent; }
  .chip-add { background: none; border: 1px dashed var(--outline); color: var(--on-surface-var);
    border-radius: 8px; height: 26px; padding: 0 10px; cursor: pointer; font: inherit; }
  .savebar { position: sticky; bottom: 0; margin-top: 20px; padding: 14px 0;
    background: linear-gradient(transparent, var(--surface) 40%); display: flex; gap: 12px; align-items: center; }
  .toast { color: var(--primary); font-size: 13px; }
</style>
</head>
<body>
<nav>
  <div class="logo">CP</div>
  <button data-view="silhouette" class="active">
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M3 13h4v8H3zm7-6h4v14h-4zm7-4h4v18h-4z"/></svg></span>
    <span class="label">Silhouette</span>
  </button>
  <button data-view="explore">
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg></span>
    <span class="label">Explore</span>
  </button>
  <button data-view="ripple">
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M12 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm0-4a6 6 0 0 0-6 6h2a4 4 0 0 1 8 0h2a6 6 0 0 0-6-6zm0-4A10 10 0 0 0 2 12h2a8 8 0 0 1 16 0h2A10 10 0 0 0 12 2z"/></svg></span>
    <span class="label">Ripple</span>
  </button>
  <button data-view="changes">
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L9 12H6a7 7 0 1 1 2 4.9l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2.1V8z"/></svg></span>
    <span class="label">Changes</span>
  </button>
  <button data-view="workbench">
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M22 8h-5V6a3 3 0 0 0-3-3h-4a3 3 0 0 0-3 3v2H2v11h20zM9 6a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2H9zm11 11H4v-7h4v2h2v-2h4v2h2v-2h4z"/></svg></span>
    <span class="label">Workbench</span>
  </button>
  <button data-view="settings">
    <span class="pill"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 .1-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6H9l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.4-1-2 3.4L2.6 11a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.3 7.3 0 0 0 1.7 1l.4 2.6h6l.4-2.6a7.3 7.3 0 0 0 1.7-1l2.4 1 2-3.4zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></span>
    <span class="label">Settings</span>
  </button>
</nav>
<main>
  <div class="appbar">
    <span class="headline">CodePulse</span>
    <span class="root-path mono" id="root-path"></span>
  </div>
  <div id="view"></div>
</main>
<script>
const $ = (s, el=document) => el.querySelector(s);
const view = $("#view");
let summary = null;

const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (path) => (await fetch(path)).json();

/* ---- silhouette ---- */
async function renderSilhouette() {
  view.innerHTML = '<div class="spinner">Reading the map...</div>';
  summary = summary || await api("/api/summary");
  $("#root-path").textContent = summary.root;
  const maxRegion = Math.max(...summary.regions.map(r => r.count), 1);
  const maxFan = Math.max(...summary.load_bearing.map(l => l.fan_in), 1);
  view.innerHTML = `
    <div class="stat-row">
      <div class="stat"><div class="n">${summary.files}</div><div class="label">files</div></div>
      <div class="stat"><div class="n">${summary.units}</div><div class="label">units</div></div>
      <div class="stat"><div class="n">${summary.edges}</div><div class="label">edges</div></div>
    </div>
    <div class="grid">
      <div class="card"><h3 class="title">Regions</h3>${summary.regions.map(r => `
        <div style="padding:6px 0">
          <div style="display:flex;justify-content:space-between"><span class="mono">${esc(r.name)}</span><span class="body-s">${r.count} units</span></div>
          <div class="bar"><i style="width:${Math.round(100*r.count/maxRegion)}%"></i></div>
        </div>`).join("")}
      </div>
      <div class="card"><h3 class="title">Load-bearing units <span class="body-s">(highest fan-in — tread carefully)</span></h3>
        ${summary.load_bearing.map(l => `
        <div class="rowline" onclick="gotoRipple('${esc(l.qualname)}')">
          <div style="display:flex;justify-content:space-between"><span class="mono">${esc(l.qualname)}</span><span class="body-s">${l.fan_in} dependents</span></div>
          <div class="body-s">${esc(l.path)}</div>
          <div class="bar"><i style="width:${Math.round(100*l.fan_in/maxFan)}%"></i></div>
        </div>`).join("")}
      </div>
      <div class="card"><h3 class="title">Simplicity audit <span class="body-s">(identical implementations)</span></h3>
        ${summary.duplicates.length ? summary.duplicates.map(g => `
          <div class="rowline"><span class="chip">${g.length}×</span> ${g.map(u => `<span class="mono">${esc(u.path)}::${esc(u.qualname)}</span>`).join('<span class="muted">  ==  </span>')}</div>
        `).join("") : '<span class="body-s">No duplicate bodies. Clean.</span>'}
      </div>
    </div>`;
}

/* ---- explore ---- */
function renderExplore() {
  view.innerHTML = `
    <div class="field">
      <input id="q" placeholder="Where does it live? Describe the behavior..." autofocus>
      <button class="btn" onclick="doSearch()">Locate</button>
    </div>
    <div class="two-col"><div id="results"></div><div id="unit-card"></div></div>`;
  $("#q").addEventListener("keydown", e => e.key === "Enter" && doSearch());
}
async function doSearch() {
  const q = $("#q").value.trim(); if (!q) return;
  $("#results").innerHTML = '<div class="spinner">Locating...</div>';
  const data = await api("/api/search?q=" + encodeURIComponent(q));
  $("#results").innerHTML = `<div class="card">` + (data.results.length ? data.results.map(r => `
    <div class="rowline" onclick="openUnit('${esc(r.path)}','${esc(r.qualname)}')">
      <span class="chip">${r.score}</span> <span class="mono">${esc(r.qualname)}</span>
      <div class="body-s">${esc(r.path)}${r.doc ? " — " + esc(r.doc) : ""}</div>
    </div>`).join("") : '<span class="body-s">Nothing matches.</span>') + `</div>`;
}
async function openUnit(path, qualname) {
  $("#unit-card").innerHTML = '<div class="spinner">Loading card...</div>';
  const u = await api(`/api/unit?path=${encodeURIComponent(path)}&qualname=${encodeURIComponent(qualname)}`);
  $("#unit-card").innerHTML = `
    <div class="card filled">
      <h3 class="title mono">${esc(u.qualname)} <span class="chip">${esc(u.kind)}</span></h3>
      <div class="body-s" style="margin-bottom:8px">${esc(u.path)}</div>
      ${u.doc ? `<p style="margin-bottom:10px">${esc(u.doc)}</p>` : ""}
      <div class="label" style="margin-top:6px">CONTRACT</div>
      <code>(${u.params.map(esc).join(", ")})${u.returns ? " → " + esc(u.returns) : ""}</code>
      <div class="label" style="margin-top:12px">CALLS</div>
      <div>${u.calls.length ? u.calls.map(c => `<span class="chip mono">${esc(c)}</span>`).join("") : '<span class="body-s">nothing</span>'}</div>
      <div class="label" style="margin-top:12px">DIRECT DEPENDENTS (${u.dependents.length})</div>
      <div class="body-s mono">${u.dependents.slice(0, 8).map(esc).join("<br>") || "none"}</div>
      <div style="margin-top:14px"><button class="btn tonal" onclick="gotoRipple('${esc(u.qualname)}')">Blast radius: ${u.radius} unit${u.radius === 1 ? "" : "s"}</button></div>
    </div>`;
}

/* ---- ripple ---- */
function renderRipple(prefill) {
  view.innerHTML = `
    <div class="field">
      <input id="rq" placeholder="Unit or state name — what breaks if I change it?" value="${esc(prefill || "")}">
      <button class="btn" onclick="doRipple()">Ripple</button>
    </div>
    <div id="ripple-out"></div>`;
  $("#rq").addEventListener("keydown", e => e.key === "Enter" && doRipple());
  if (prefill) doRipple();
}
async function doRipple() {
  const name = $("#rq").value.trim(); if (!name) return;
  $("#ripple-out").innerHTML = '<div class="spinner">Computing the ripple...</div>';
  const d = await api("/api/radius?name=" + encodeURIComponent(name));
  if (d.error) { $("#ripple-out").innerHTML = `<div class="card">${esc(d.error)}</div>`; return; }
  const W = 900, H = 620, cx = W / 2, cy = H / 2;
  let svg = "";
  d.hops.forEach(h => { svg += `<circle class="ring" cx="${cx}" cy="${cy}" r="${h.depth * 130}"/>`; });
  d.hops.forEach(h => {
    const shown = h.units.slice(0, 16);
    shown.forEach((u, i) => {
      const a = (2 * Math.PI * i) / shown.length - Math.PI / 2;
      const x = cx + Math.cos(a) * h.depth * 130, y = cy + Math.sin(a) * h.depth * 130;
      const anchor = Math.cos(a) >= 0 ? "start" : "end";
      svg += `<circle class="node" cx="${x}" cy="${y}" r="5"/>
              <text x="${x + (Math.cos(a) >= 0 ? 9 : -9)}" y="${y + 3}" text-anchor="${anchor}">${esc(u.qualname.slice(0, 34))}</text>`;
    });
  });
  svg += `<circle class="core" cx="${cx}" cy="${cy}" r="10"/>
          <text x="${cx}" y="${cy - 18}" text-anchor="middle" style="font-weight:700;fill:var(--on-surface)">${esc(d.target)}</text>`;
  $("#ripple-out").innerHTML = `
    <div class="card">
      <h3 class="title">${d.total} unit${d.total === 1 ? "" : "s"} at risk if <span class="mono">${esc(d.target)}</span> changes</h3>
      <svg id="ripple-svg" viewBox="0 0 ${W} ${H}" style="width:100%;max-height:66vh"></svg>
      ${d.hops.map(h => `<div style="margin-top:6px"><span class="chip">${h.depth} hop${h.depth > 1 ? "s" : ""}</span>
        <span class="body-s mono">${h.units.map(u => esc(u.qualname)).join(", ")}</span></div>`).join("")}
    </div>`;
  $("#ripple-svg").innerHTML = svg;
}
function gotoRipple(name) { setView("ripple"); renderRipple(name); }

/* ---- changes ---- */
async function renderChanges() {
  view.innerHTML = '<div class="spinner">Re-reading the working tree and judging every changed unit...</div>';
  const d = await api("/api/changed");
  view.innerHTML = `<div class="card">
    <h3 class="title">What changed since the last index</h3>
    ${d.items.length ? d.items.map(i => `
      <div class="rowline">
        <span class="chip ${esc(i.classification)}">${esc(i.classification).toUpperCase()}</span>
        <span class="mono">${esc(i.path)} :: ${esc(i.qualname)}</span>
        <div class="body-s">${esc(i.summary)}</div>
      </div>`).join("") : '<span class="body-s">Nothing changed. The map is current.</span>'}
  </div>`;
}

/* ---- workbench ---- */
async function renderWorkbench() {
  view.innerHTML = '<div class="spinner">Loading workpieces...</div>';
  const d = await api("/api/workpieces");
  const statusChip = s => ({delivered:"new", escalated:"minor", rejected:"major", failed:"removed"}[s] || "patch");
  view.innerHTML = d.items.length ? `<div class="grid">` + d.items.map(w => `
    <div class="card">
      <h3 class="title">#${w.issue.number} ${esc(w.issue.title)}
        <span class="chip ${statusChip(w.status)}">${esc(w.status).toUpperCase()} v${w.version}</span></h3>
      ${w.gate && !w.gate.eligible ? `<div class="body-s">Gate: ${w.gate.reasons.map(esc).join("; ")}</div>` : ""}
      ${w.change ? `<div class="label" style="margin-top:8px">CHANGE</div>
        <div class="body-s mono">${esc(w.change.branch)} — ${w.change.files.map(esc).join(", ")}</div>` : ""}
      ${w.proof ? `<div class="label" style="margin-top:8px">PROOF</div>
        <div class="body-s">${w.proof.passed ? "passed" : "FAILED"}: ${w.proof.selected.map(esc).join(", ") || "whole suite"}</div>` : ""}
      ${(w.verdict || []).map(v => `<div style="margin-top:6px"><span class="chip ${esc(v.classification)}">${esc(v.classification).toUpperCase()}</span>
        <span class="mono">${esc(v.qualname)}</span><div class="body-s">${esc(v.summary)}</div></div>`).join("")}
      ${w.rejection ? `<div class="body-s" style="margin-top:8px;color:var(--error)">${esc(w.rejection)}</div>` : ""}
    </div>`).join("") + `</div>`
    : '<div class="card"><span class="body-s">No workpieces yet. Run: <code>pulse.py work &lt;issue&gt;</code></span></div>';
}

/* ---- settings ---- */
let cfgState = null, cfgSchema = null;
async function renderSettings() {
  view.innerHTML = '<div class="spinner">Loading configurables...</div>';
  const d = await api("/api/config");
  cfgSchema = d.schema; cfgState = JSON.parse(JSON.stringify(d.values));
  paintSettings();
}
function paintSettings() {
  const cards = Object.entries(cfgSchema).map(([section, fields]) => {
    const rows = Object.entries(fields).filter(([k]) => !k.startsWith("_")).map(([key, spec]) =>
      settingRow(section, key, spec, cfgState[section][key])).join("");
    return `<div class="card"><h3 class="title">${esc(section)}<span class="owner-tag">${esc(fields._owner)}</span></h3>${rows}</div>`;
  }).join("");
  view.innerHTML = `<div class="grid">${cards}</div>
    <div class="savebar"><button class="btn" onclick="saveSettings()">Save configuration</button>
      <span class="body-s">Written to <code>.codepulse/config.json</code>; the scanner, gate, judge, and hooks read it live.</span>
      <span class="toast" id="toast"></span></div>`;
}
function settingRow(section, key, spec, value) {
  const disp = spec.live ? "" : '<span class="disp"> · display-only</span>';
  let control = "";
  if (spec.type === "switch") {
    control = `<label class="switch"><input type="checkbox" ${value ? "checked" : ""}
      onchange="setCfg('${section}','${key}',this.checked)"><span class="track"><span class="thumb"></span></span></label>`;
  } else if (spec.type === "slider") {
    control = `<div class="slider"><input type="range" min="${spec.min}" max="${spec.max}" value="${value}"
      ${spec.live ? "" : "disabled"} oninput="setCfg('${section}','${key}',+this.value);this.nextElementSibling.textContent=this.value">
      <span class="val">${value}</span></div>`;
  } else if (spec.type === "select") {
    control = `<select ${spec.live ? "" : "disabled"} onchange="setCfg('${section}','${key}',this.value)">
      ${spec.options.map(o => `<option ${o === value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  }
  const chips = spec.type === "chips" ? `<div class="chipbox">
      ${(value || []).map(v => `<span class="chip rm" onclick="rmChip('${section}','${key}','${esc(v)}')">${esc(v)} ✕</span>`).join("")}
      ${spec.live ? `<button class="chip-add" onclick="addChip('${section}','${key}')">+ add</button>` : ""}</div>` : "";
  return `<div class="setting"><div class="top"><div><span class="k mono">${esc(key)}</span>${disp}
      <div class="help">${esc(spec.help)}</div></div>${control}</div>${chips}</div>`;
}
function setCfg(s, k, v) { cfgState[s][k] = v; flash("unsaved changes"); }
function rmChip(s, k, v) { cfgState[s][k] = cfgState[s][k].filter(x => x !== v); paintSettings(); flash("unsaved changes"); }
function addChip(s, k) { const v = prompt("Add value to " + k); if (v) { cfgState[s][k] = [...cfgState[s][k], v.trim()]; paintSettings(); flash("unsaved changes"); } }
function flash(msg) { const t = $("#toast"); if (t) t.textContent = msg; }
async function saveSettings() {
  flash("saving...");
  const r = await api2("/api/config", cfgState);
  if (r.ok) { cfgState = r.values; flash("saved · config is live"); }
  else flash("error: " + (r.error || "unknown"));
}
const api2 = async (path, body) => (await fetch(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})).json();

/* ---- router ---- */
const renderers = { silhouette: renderSilhouette, explore: renderExplore, ripple: () => renderRipple(), changes: renderChanges, workbench: renderWorkbench, settings: renderSettings };
function setView(name) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.view === name));
}
document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => { setView(b.dataset.view); renderers[b.dataset.view](); }));
renderSilhouette();
</script>
</body>
