<!doctype html>
<html lang="en" data-theme="white" data-color="mono" data-font="system" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodePulse</title>
<style>
  /* ── tokens: two GitHub-code-theme parallels, one ink one paper ── */
  :root, [data-theme="white"] {
    --paper: #ffffff;
    --ink:   #1f2328;
    --mut:   #656d76;
    --soft:  #d0d7de;
    --hush:  #f6f8fa;
    --k-fn:  #8250df;   /* function, method */
    --k-cls: #953800;   /* class, stage */
    --k-st:  #cf222e;   /* state */
    --k-key: #0550ae;   /* key, variable, output */
    --k-res: #116329;   /* resource */
  }
  [data-theme="black"] {
    --paper: #0d1117;
    --ink:   #e6edf3;
    --mut:   #8b949e;
    --soft:  #30363d;
    --hush:  #161b22;
    --k-fn:  #d2a8ff;
    --k-cls: #ffa657;
    --k-st:  #ff7b72;
    --k-key: #79c0ff;
    --k-res: #7ee787;
  }
  :root { --fs: 15px; --fs-mono: 13px; --fs-small: 12px;
          --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          --mono: ui-monospace, Menlo, Consolas, monospace; }
  [data-size="s"] { --fs: 13px; --fs-mono: 11.5px; --fs-small: 11px; }
  [data-size="l"] { --fs: 17px; --fs-mono: 14.5px; --fs-small: 13px; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: var(--fs)/1.5 var(--sans);
    color: var(--ink); background: var(--paper);
    display: flex; flex-direction: column;
  }
  [data-font="mono"] body { font-family: var(--mono); }
  code, pre, .mono { font-family: var(--mono); font-size: var(--fs-mono); }

  /* ── entity-kind color coding (only when COLOR: BY KIND) ── */
  [data-color="kind"] .k-function, [data-color="kind"] .k-method   { color: var(--k-fn); }
  [data-color="kind"] .k-class,    [data-color="kind"] .k-stage    { color: var(--k-cls); }
  [data-color="kind"] .k-state                                     { color: var(--k-st); }
  [data-color="kind"] .k-key, [data-color="kind"] .k-variable,
  [data-color="kind"] .k-output                                    { color: var(--k-key); }
  [data-color="kind"] .k-resource                                  { color: var(--k-res); }
  [data-color="kind"] svg g.k-function rect, [data-color="kind"] svg g.k-method rect { stroke: var(--k-fn); }
  [data-color="kind"] svg g.k-class rect,    [data-color="kind"] svg g.k-stage rect  { stroke: var(--k-cls); }
  [data-color="kind"] svg g.k-state rect                                             { stroke: var(--k-st); }
  [data-color="kind"] svg g.k-key rect, [data-color="kind"] svg g.k-variable rect,
  [data-color="kind"] svg g.k-output rect                                            { stroke: var(--k-key); }
  [data-color="kind"] svg g.k-resource rect                                          { stroke: var(--k-res); }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 14px; border-bottom: 1.5px solid var(--ink);
  }
  header h1 { font-size: var(--fs); font-weight: 700; letter-spacing: .08em; }
  #stats { margin-left: auto; font-size: var(--fs-small); text-transform: uppercase; letter-spacing: .05em; color: var(--mut); }
  #cog {
    border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
    padding: 4px 12px; font: inherit; font-size: var(--fs-small); text-transform: uppercase;
    letter-spacing: .05em; cursor: pointer;
  }
  #cog:hover, #cog.active { background: var(--ink); color: var(--paper); }

  #ask { display: flex; border-bottom: 1.5px solid var(--ink); }
  .tabs { display: flex; }
  .tabs button {
    border: 0; border-right: 1px solid var(--soft); background: var(--paper);
    padding: 8px 12px; font: inherit; font-size: var(--fs-small); text-transform: uppercase;
    letter-spacing: .05em; color: var(--ink); cursor: pointer; white-space: nowrap;
  }
  .tabs button.active { background: var(--ink); color: var(--paper); }
  #arg {
    flex: 1; min-width: 60px; border: 0; border-left: 1.5px solid var(--ink);
    padding: 8px 12px; font: inherit; background: var(--paper); color: var(--ink);
  }
  #arg:focus { outline: none; background: var(--hush); }
  #run {
    border: 0; border-left: 1.5px solid var(--ink); background: var(--paper); color: var(--ink);
    padding: 8px 16px; font: inherit; font-size: var(--fs-small); text-transform: uppercase;
    letter-spacing: .05em; cursor: pointer;
  }
  #run:hover { background: var(--ink); color: var(--paper); }

  main { flex: 1; display: flex; min-height: 0; }
  #rail { width: 260px; border-right: 1.5px solid var(--ink); overflow: auto; flex: none; }
  #rail .file { border-bottom: 1px solid var(--soft); }
  #rail summary {
    padding: 6px 10px; cursor: pointer; list-style: none;
    font-family: var(--mono); font-size: var(--fs-small); color: var(--mut);
  }
  #rail summary::-webkit-details-marker { display: none; }
  #rail details[open] summary { color: var(--ink); font-weight: 600; }
  #rail .ent {
    display: flex; gap: 8px; padding: 3px 10px 3px 20px; cursor: pointer;
    font-family: var(--mono); font-size: var(--fs-small);
  }
  #rail .ent:hover { background: var(--ink); color: var(--paper); }
  #rail .ent .kind { margin-left: auto; color: var(--mut); font-size: calc(var(--fs-small) - 1px); }
  #rail .ent:hover .kind { color: var(--paper); }

  #stage { flex: 1; overflow: auto; padding: 14px; }
  #out {
    font-family: var(--mono); font-size: var(--fs-mono);
    background: var(--hush); border: 1px solid var(--soft);
    padding: 12px; white-space: pre-wrap; word-break: break-word; min-height: 120px;
  }
  #out .lnk { text-decoration: underline; cursor: pointer; }
  #out .lnk:hover { background: var(--ink); color: var(--paper); }
  #empty { color: var(--mut); text-align: center; padding: 60px 0; }

  #viz { overflow: auto; }
  #viz .caption {
    font-size: var(--fs-small); text-transform: uppercase; letter-spacing: .05em;
    color: var(--mut); margin-bottom: 8px;
  }
  svg { display: block; }
  svg text { font-family: var(--mono); font-size: var(--fs-small); fill: var(--ink); }
  svg text.mut { fill: var(--mut); font-size: calc(var(--fs-small) - 2px); }
  svg text.col { fill: var(--mut); font-size: calc(var(--fs-small) - 1px); letter-spacing: .05em; }
  svg text.inv { fill: var(--paper); }
  svg .node { cursor: pointer; transition: opacity .15s; }
  svg .node rect { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
  svg .node.target rect { fill: var(--ink); }
  svg .node:hover rect { fill: var(--ink); }
  svg .node:hover text { fill: var(--paper); }
  svg path.edge { fill: none; stroke: var(--soft); transition: opacity .15s; }
  svg path.edge.hot { stroke: var(--ink); }
  svg .dim { opacity: .18; }

  table { border-collapse: collapse; font-size: var(--fs-mono); width: 100%; }
  th { background: var(--hush); font-weight: 600; }
  th, td { border: 1px solid var(--soft); padding: 5px 8px; text-align: left; }
  th { font-size: calc(var(--fs-small) - 1px); text-transform: uppercase; letter-spacing: .05em; }
  td.mono { font-family: var(--mono); font-size: var(--fs-small); }
  td.n { text-align: right; font-family: var(--mono); font-size: var(--fs-small); }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--ink); color: var(--paper) !important; }

  /* ── the card ── */
  .card { border: 1.5px solid var(--ink); padding: 16px; margin-bottom: 14px; }
  .card .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .card .head .nm { font-family: var(--mono); font-size: calc(var(--fs) + 2px); font-weight: 700; }
  .card .pill { border: 1px solid var(--ink); padding: 1px 7px; font-size: calc(var(--fs-small) - 1px);
                text-transform: uppercase; letter-spacing: .04em; }
  .card .where { color: var(--mut); font-size: var(--fs-small); font-family: var(--mono); }
  .card .prov { margin-left: auto; color: var(--mut); font-size: calc(var(--fs-small) - 1px);
                text-transform: uppercase; letter-spacing: .05em; }
  .card .says { margin: 10px 0 2px; font-size: var(--fs); }
  .card .says.src { font-family: var(--mono); font-size: var(--fs-small); color: var(--mut); }
  .sect { margin-top: 14px; }
  .sect .sh { font-size: calc(var(--fs-small) - 1px); text-transform: uppercase;
              letter-spacing: .05em; color: var(--mut); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--ink); padding: 2px 8px; font-family: var(--mono);
          font-size: var(--fs-small); cursor: pointer; }
  .chip:hover { background: var(--ink); color: var(--paper); }
  .chip small { color: var(--mut); }
  .chip:hover small { color: var(--paper); }
  .chip.ext { border-color: var(--soft); color: var(--mut); cursor: default; }
  .hintline { color: var(--mut); font-size: var(--fs-small); }

  /* ── search results ── */
  .hit { border: 1.5px solid var(--ink); border-bottom: 0; padding: 8px 12px; cursor: pointer;
         display: flex; gap: 12px; align-items: baseline; }
  .hit:last-of-type { border-bottom: 1.5px solid var(--ink); }
  .hit:hover { background: var(--ink); color: var(--paper); }
  .hit:hover * { color: var(--paper) !important; }
  .hit .sc { font-family: var(--mono); font-size: var(--fs-small); width: 42px; color: var(--mut); }
  .hit .nm { font-family: var(--mono); font-size: var(--fs-mono); font-weight: 600; }
  .hit .pt { font-family: var(--mono); font-size: var(--fs-small); color: var(--mut); }
  .hit .mt { color: var(--mut); font-size: var(--fs-small); overflow: hidden;
             text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  /* ── settings: four rows, segmented, instant ── */
  #viz .setrow { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--soft); }
  #viz .setrow .lbl {
    width: 90px; font-size: var(--fs-small); text-transform: uppercase;
    letter-spacing: .05em; color: var(--mut);
  }
  .seg { display: inline-flex; border: 1.5px solid var(--ink); }
  .seg button {
    border: 0; border-right: 1px solid var(--soft); background: var(--paper); color: var(--ink);
    padding: 6px 16px; font: inherit; font-size: var(--fs-small); text-transform: uppercase;
    letter-spacing: .05em; cursor: pointer;
  }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--ink); color: var(--paper); }

  footer {
    padding: 6px 14px; border-top: 1.5px solid var(--ink);
    font-size: var(--fs-small); text-transform: uppercase; letter-spacing: .05em; color: var(--mut);
  }

  @media (max-width: 700px) {   /* editor sidebar: the answer is the panel */
    #rail { display: none; }
    #stats { display: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>CODEPULSE</h1>
    <span id="stats">&nbsp;</span>
    <button id="cog">Settings</button>
  </header>

  <div id="ask">
    <nav class="tabs" id="tabs">
      <button data-v="what">WHAT</button>
      <button data-v="who">WHO</button>
      <button data-v="radius">BREAKS</button>
      <button data-v="changed">CHANGED</button>
      <button data-v="locate">WHERE</button>
      <button data-v="map" class="active">MAP</button>
      <button data-v="handlers">HANDLERS</button>
    </nav>
    <input id="arg" placeholder="search the map — a name, a typo, or words from a docstring" spellcheck="false">
    <button id="run">SEARCH</button>
  </div>

  <main>
    <aside id="rail"></aside>
    <section id="stage">
      <div id="empty">Pick an entity, or ask the map a question.</div>
      <div id="out" hidden></div>
      <div id="viz" hidden></div>
    </section>
  </main>

  <footer>ONE MAP &middot; TWO READERS &middot; SIX QUESTIONS</footer>

<script>
  const $ = (s) => document.querySelector(s);
  const SVGNS = "http://www.w3.org/2000/svg";
  let verb = "map";

  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const api = async (url) => (await fetch(url)).json();
  const kindClass = (k) => k ? "k-" + k.replace(/[^\w-]/g, "") : "";

  // ── settings: the moat is this staying small ────────────────────────
  const DEFAULTS = { theme: "white", color: "mono", font: "system", size: "m" };
  let settings = { ...DEFAULTS };
  try { Object.assign(settings, JSON.parse(localStorage.getItem("pulse") || "{}")); } catch (e) {}

  function applySettings() {
    const root = document.documentElement;
    for (const k of ["theme", "color", "font", "size"]) root.dataset[k] = settings[k];
    try { localStorage.setItem("pulse", JSON.stringify(settings)); } catch (e) {}
  }

  const SETTING_ROWS = [
    ["theme", "First color", [["white", "White first"], ["black", "Black first"]]],
    ["color", "Entities",    [["mono", "Mono"], ["kind", "By kind"]]],
    ["font",  "Font",        [["system", "System"], ["mono", "Mono"]]],
    ["size",  "Size",        [["s", "S"], ["m", "M"], ["l", "L"]]],
  ];

  function drawSettings() {
    const viz = $("#viz");
    viz.innerHTML = "";
    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = "four choices · instant · saved on this machine";
    viz.appendChild(cap);
    for (const [key, label, options] of SETTING_ROWS) {
      const row = document.createElement("div");
      row.className = "setrow";
      const lbl = document.createElement("span");
      lbl.className = "lbl";
      lbl.textContent = label;
      row.appendChild(lbl);
      const seg = document.createElement("div");
      seg.className = "seg";
      for (const [value, text] of options) {
        const b = document.createElement("button");
        b.textContent = text;
        b.classList.toggle("on", settings[key] === value);
        b.addEventListener("click", () => {
          settings[key] = value;
          applySettings();
          drawSettings();
        });
        seg.appendChild(b);
      }
      row.appendChild(seg);
      viz.appendChild(row);
    }
    const row = document.createElement("div");
    row.className = "setrow";
    const lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = " ";
    row.appendChild(lbl);
    const seg = document.createElement("div");
    seg.className = "seg";
    const b = document.createElement("button");
    b.textContent = "Defaults";
    b.addEventListener("click", () => {
      settings = { ...DEFAULTS };
      applySettings();
      drawSettings();
    });
    seg.appendChild(b);
    row.appendChild(seg);
    viz.appendChild(row);
  }

  function linkify(t) {
    return t.replace(
      /((?:[\w.-]+\/)*[\w.-]+\.[\w]+) :: ([\w.-]+|&lt;module&gt;)/g,
      '<span class="lnk" data-path="$1" data-name="$2">$&</span>'
    );
  }

  function setActive(v) {
    verb = v;
    $("#cog").classList.remove("active");
    document.querySelectorAll("#tabs button").forEach(
      (b) => b.classList.toggle("active", b.dataset.v === v)
    );
  }

  function show(which) {          // "out" | "viz"
    $("#empty").hidden = true;
    $("#out").hidden = which !== "out";
    $("#viz").hidden = which !== "viz";
  }

  function svgEl(tag, attrs, parent) {
    const el = document.createElementNS(SVGNS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(el);
    return el;
  }

  function edgeDash(kind) {
    if (kind === "reads") return "5 3";
    if (kind === "inherits") return "1 3";
    return "";
  }

  // ── focus mode: click a node, the rest steps back ───────────────────
  function focusable(svg, nodeEls, edgeRecs) {
    // nodeEls: Map(id -> <g>), edgeRecs: [{el, a, b}]
    let focused = null;
    function apply() {
      const neighbors = new Set();
      if (focused) {
        neighbors.add(focused);
        for (const e of edgeRecs) {
          if (e.a === focused) neighbors.add(e.b);
          if (e.b === focused) neighbors.add(e.a);
        }
      }
      for (const [id, g] of nodeEls) {
        g.classList.toggle("dim", focused !== null && !neighbors.has(id));
      }
      for (const e of edgeRecs) {
        const on = focused !== null && (e.a === focused || e.b === focused);
        e.el.classList.toggle("hot", on);
        e.el.classList.toggle("dim", focused !== null && !on);
      }
    }
    svg.addEventListener("click", (ev) => {
      if (ev.target === svg) { focused = null; apply(); }
    });
    return (id) => {
      focused = focused === id ? null : id;
      apply();
    };
  }

  // ── BREAKS / REACH: the hop diagram ─────────────────────────────────
  function drawRadius(data) {
    const viz = $("#viz");
    viz.innerHTML = "";
    const out = data.direction === "out";
    const cap = document.createElement("div");
    cap.className = "caption";
    const hops = data.nodes.length ? Math.max(...data.nodes.map(n => n.hop)) : 0;
    const head = out ? "reach of" : "blast radius of";
    const what = out ? "reached" : "at risk";
    cap.textContent = data.nodes.length
      ? `${head} ${data.target.path} :: ${data.target.name} — ` +
        `${data.nodes.length} ${what}, ${hops} hop${hops === 1 ? "" : "s"} deep · ` +
        `click to focus · double-click to re-center · solid calls, dashed reads, dotted inherits`
      : `${head} ${data.target.path} :: ${data.target.name} — ` +
        (out ? "calls nothing on the map." : "nothing depends on it.");
    viz.appendChild(cap);

    const byHop = new Map([[0, [{ path: data.target.path, name: data.target.name, hop: 0, kind: "" }]]]);
    for (const n of data.nodes) {
      if (!byHop.has(n.hop)) byHop.set(n.hop, []);
      byHop.get(n.hop).push(n);
    }
    const colW = 280, boxW = 230, boxH = 34, gap = 10, top = 44;
    const pos = new Map();
    const nodeEls = new Map();
    const rows = Math.max(...[...byHop.values()].map(c => c.length));
    const svg = svgEl("svg", {
      width: byHop.size * colW + 40,
      height: top + rows * (boxH + gap) + 20,
    });
    const edgeLayer = svgEl("g", {}, svg);

    let focus = null;   // assigned after edges exist
    for (const [hop, col] of [...byHop.entries()].sort((a, b) => a[0] - b[0])) {
      const x = 20 + hop * colW;
      svgEl("text", { x, y: 24, class: "col" }, svg).textContent =
        hop === 0 ? "TARGET" : `${hop} HOP${hop === 1 ? "" : "S"}`;
      col.forEach((n, i) => {
        const y = top + i * (boxH + gap);
        const id = `${n.path}::${n.name}`;
        const g = svgEl("g", {
          class: ["node", n.hop === 0 ? "target" : "", kindClass(n.kind)].join(" ").trim(),
        }, svg);
        svgEl("rect", { x, y, width: boxW, height: boxH }, g);
        const t1 = svgEl("text", { x: x + 8, y: y + 15, class: n.hop === 0 ? "inv" : "" }, g);
        t1.textContent = n.name.length > 30 ? n.name.slice(0, 29) + "…" : n.name;
        const t2 = svgEl("text", { x: x + 8, y: y + 28, class: "mut" + (n.hop === 0 ? " inv" : "") }, g);
        t2.textContent = n.path;
        g.addEventListener("click", (ev) => { ev.stopPropagation(); focus(id); });
        g.addEventListener("dblclick", () => {
          if (n.hop === 0) run("what", id);
          else runRadius(id, data.direction);
        });
        pos.set(id, { x, y, hop: n.hop });
        nodeEls.set(id, g);
      });
    }
    const edgeRecs = [];
    for (const e of data.edges) {
      const a = pos.get(e.src), b = pos.get(e.dst);
      if (!a || !b) continue;
      const from = a.hop <= b.hop ? a : b, to = a.hop <= b.hop ? b : a;
      const x1 = from.x + boxW, y1 = from.y + boxH / 2, x2 = to.x, y2 = to.y + boxH / 2;
      const mid = (x1 + x2) / 2;
      const p = svgEl("path", {
        class: "edge", d: `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`,
        "stroke-dasharray": edgeDash(e.kind), "stroke-width": 1.2,
      }, edgeLayer);
      edgeRecs.push({ el: p, a: e.src, b: e.dst });
    }
    focus = focusable(svg, nodeEls, edgeRecs);
    viz.appendChild(svg);
  }

  async function runRadius(arg, dir) {
    setActive("radius");
    $("#arg").value = arg;
    const data = await api(
      `/api/radius?name=${encodeURIComponent(arg)}&dir=${encodeURIComponent(dir || "in")}`);
    if (!data.target) {
      $("#out").innerHTML = linkify(esc(`No entity matching '${arg}'.`));
      show("out");
      return;
    }
    drawRadius(data);
    show("viz");
  }

  // ── MAP: the whole repo, layered by dependency depth ────────────────
  function drawMap(data) {
    const viz = $("#viz");
    viz.innerHTML = "";
    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = `the whole map · ${data.nodes.length} ${data.mode === "file" ? "files" : "directories"}` +
      ` · click to focus · double-click to inspect · thicker edge = more references`;
    viz.appendChild(cap);

    const cols = new Map();
    for (const n of data.nodes) {
      if (!cols.has(n.depth)) cols.set(n.depth, []);
      cols.get(n.depth).push(n);
    }
    for (const col of cols.values()) col.sort((a, b) => b.entities - a.entities);

    const colW = 250, boxW = 210, boxH = 24, gap = 8, top = 40;
    const rows = Math.max(...[...cols.values()].map(c => c.length));
    const svg = svgEl("svg", {
      width: cols.size * colW + 40,
      height: top + rows * (boxH + gap) + 20,
    });
    const edgeLayer = svgEl("g", {}, svg);
    const pos = new Map();
    const nodeEls = new Map();

    let focus = null;
    for (const [depth, col] of [...cols.entries()].sort((a, b) => a[0] - b[0])) {
      const x = 20 + depth * colW;
      col.forEach((n, i) => {
        const y = top + i * (boxH + gap);
        const g = svgEl("g", { class: "node" }, svg);
        svgEl("rect", { x, y, width: boxW, height: boxH }, g);
        const label = n.id.length > 26 ? "…" + n.id.slice(-25) : n.id;
        svgEl("text", { x: x + 6, y: y + 16 }, g).textContent = label;
        const badge = svgEl("text", { x: x + boxW - 6, y: y + 16, class: "mut", "text-anchor": "end" }, g);
        badge.textContent = String(n.entities);
        g.addEventListener("click", (ev) => { ev.stopPropagation(); focus(n.id); });
        if (data.mode === "file") {
          g.addEventListener("dblclick", () => run("what", `${n.id}::<module>`));
        }
        pos.set(n.id, { x, y });
        nodeEls.set(n.id, g);
      });
    }
    const edgeRecs = [];
    for (const e of data.edges) {
      const a = pos.get(e.src), b = pos.get(e.dst);
      if (!a || !b) continue;
      const x1 = a.x + boxW, y1 = a.y + boxH / 2, x2 = b.x, y2 = b.y + boxH / 2;
      const mid = (x1 + x2) / 2;
      const p = svgEl("path", {
        class: "edge",
        d: `M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}`,
        "stroke-width": Math.min(1 + Math.log2(e.n), 4).toFixed(1),
      }, edgeLayer);
      edgeRecs.push({ el: p, a: e.src, b: e.dst });
    }
    focus = focusable(svg, nodeEls, edgeRecs);
    viz.appendChild(svg);
  }

  // ── HANDLERS: the board ─────────────────────────────────────────────
  function drawHandlers(list) {
    const viz = $("#viz");
    viz.innerHTML = "";
    const cap = document.createElement("div");
    cap.className = "caption";
    cap.textContent = `estimated ${list.length} handler-level function${list.length === 1 ? "" : "s"}` +
      ` — uncalled roots with downstream reach · click one to see its reach`;
    viz.appendChild(cap);
    if (!list.length) return;
    const table = document.createElement("table");
    table.innerHTML = "<thead><tr><th>function</th><th>path</th><th>reach</th><th>direct</th></tr></thead>";
    const tbody = document.createElement("tbody");
    for (const h of list) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="mono ${kindClass(h.kind)}">${esc(h.name)}</td><td class="mono">${esc(h.path)}</td>` +
        `<td class="n">${h.reach}</td><td class="n">${h.direct}</td>`;
      tr.addEventListener("click", () => runRadius(`${h.path}::${h.name}`, "out"));
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    viz.appendChild(table);
  }

  // ── the card: an entity you can understand at a glance ──────────────
  function chip(node, onclick) {
    const c = document.createElement("span");
    c.className = "chip " + kindClass(node.kind);
    c.innerHTML = `${esc(node.name)} <small>${esc(node.path)}${node.edge_kind ? " · " + esc(node.edge_kind) : ""}</small>`;
    if (onclick) c.addEventListener("click", onclick);
    return c;
  }

  function cardSection(parent, header, nodes, emptyHint) {
    const s = document.createElement("div");
    s.className = "sect";
    s.innerHTML = `<div class="sh">${header}</div>`;
    if (nodes.length) {
      const chips = document.createElement("div");
      chips.className = "chips";
      for (const n of nodes) chips.appendChild(chip(n, () => run("what", `${n.path}::${n.name}`)));
      s.appendChild(chips);
    } else {
      s.innerHTML += `<div class="hintline">${emptyHint}</div>`;
    }
    parent.appendChild(s);
    return s;
  }

  function drawLocalMap(viz, data) {
    const boxW = 210, boxH = 30, gap = 8, colGap = 120, top = 30;
    const left = data.incoming.slice(0, 12);
    const right = data.outgoing.slice(0, 12);
    if (data.external.length) right.push({ name: `outside the map (${data.external.length})`,
      path: data.external.slice(0, 3).join(" · "), kind: "", ext: true });
    const rows = Math.max(left.length, right.length, 1);
    const svg = svgEl("svg", { width: 3 * boxW + 2 * colGap + 20,
                               height: top + rows * (boxH + gap) + 12 });
    const mid = { x: 10 + boxW + colGap, y: top + ((rows * (boxH + gap)) - gap) / 2 - boxH / 2 };
    const cols = [
      { items: left,  x: 10,                          label: "USED BY — WHO FEELS A CHANGE HERE" },
      { items: right, x: mid.x + boxW + colGap,       label: "USES — WHAT IT CALLS OR READS" },
    ];
    for (const col of cols) {
      svgEl("text", { x: col.x, y: 18, class: "col" }, svg).textContent = col.label;
      col.items.forEach((n, i) => {
        const y = top + i * (boxH + gap);
        const g = svgEl("g", { class: "node " + kindClass(n.kind) }, svg);
        if (n.ext) g.style.opacity = ".55";
        svgEl("rect", { x: col.x, y, width: boxW, height: boxH,
                        ...(n.ext ? { "stroke-dasharray": "4 3" } : {}) }, g);
        const t = svgEl("text", { x: col.x + 7, y: y + 14 }, g);
        t.textContent = n.name.length > 26 ? n.name.slice(0, 25) + "…" : n.name;
        svgEl("text", { x: col.x + 7, y: y + 26, class: "mut" }, g).textContent =
          (n.path || "").slice(0, 34);
        if (!n.ext) g.addEventListener("click", () => run("what", `${n.path}::${n.name}`));
        const isLeft = col.x === 10;
        const x1 = isLeft ? col.x + boxW : mid.x + boxW;
        const x2 = isLeft ? mid.x : col.x;
        const yc = y + boxH / 2, mc = (x1 + x2) / 2;
        svgEl("path", { class: "edge", "stroke-width": 1.2,
          "stroke-dasharray": n.edge_kind === "reads" ? "5 3" : (n.ext ? "3 3" : ""),
          d: `M ${x1} ${yc} C ${mc} ${yc}, ${mc} ${mid.y + boxH / 2}, ${x2} ${mid.y + boxH / 2}` }, svg);
      });
    }
    const g = svgEl("g", { class: "node target" }, svg);
    svgEl("rect", { x: mid.x, y: mid.y, width: boxW, height: boxH }, g);
    svgEl("text", { x: mid.x + 7, y: mid.y + 19, class: "inv" }, g).textContent =
      data.entity.name.length > 26 ? data.entity.name.slice(0, 25) + "…" : data.entity.name;
    viz.appendChild(svg);
  }

  async function drawCard(arg) {
    const data = await api(`/api/card?name=${encodeURIComponent(arg)}`);
    if (!data.entity) {
      $("#out").innerHTML = linkify(esc(`No entity matching '${arg}'. Try SEARCH — it forgives typos.`));
      show("out");
      return;
    }
    const e = data.entity;
    const viz = $("#viz");
    viz.innerHTML = "";
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML =
      `<div class="head"><span class="nm ${kindClass(e.kind)}">${esc(e.name)}</span>` +
      `<span class="pill">${esc(e.kind)}</span>` +
      `<span class="where">${esc(e.path)} · line ${e.line}</span>` +
      `<span class="prov" title="which recipe version mapped this">${esc(e.recipe)}@${esc(e.recipe_version)}</span></div>` +
      (e.meta ? `<div class="says ${e.doc ? "" : "src"}">${e.doc ? "&ldquo;" + esc(e.meta.split("\n")[0]) + "&rdquo;"
                 : esc(e.meta.split("\n")[0].slice(0, 100)) + " <small>(no docstring — showing its code)</small>"}</div>` : "");
    cardSection(card, "used by — who feels a change here", data.incoming,
      "nothing on the map calls this — tests, entry points, and dynamically-invoked functions look like this.");
    cardSection(card, "uses — what it calls or reads", data.outgoing,
      data.external.length ? "" : "nothing — it stands alone.");
    if (data.external.length) {
      const s = document.createElement("div");
      s.className = "sect";
      s.innerHTML = `<div class="sh">outside the map — stdlib, libraries, dynamic</div>` +
        `<div class="chips">` + data.external.slice(0, 10).map(x => `<span class="chip ext">${esc(x)}</span>`).join("") +
        (data.external.length > 10 ? `<span class="hintline">+${data.external.length - 10} more</span>` : "") + `</div>`;
      card.appendChild(s);
    }
    viz.appendChild(card);
    const capEl = document.createElement("div");
    capEl.className = "caption";
    capEl.textContent = "the local map · click any box to travel · BREAKS shows the full ripple";
    viz.appendChild(capEl);
    drawLocalMap(viz, data);
    show("viz");
  }

  // ── search: forgiving, scored ────────────────────────────────────────
  async function doSearch(q) {
    setActive("what");
    $("#arg").value = q;
    const hits = await api(`/api/search?q=${encodeURIComponent(q)}`);
    const viz = $("#viz");
    viz.innerHTML = "";
    const capEl = document.createElement("div");
    capEl.className = "caption";
    capEl.textContent = hits.length
      ? `${hits.length} match${hits.length === 1 ? "" : "es"} — scored: exact name, then fuzzy, then docstring words · click to open`
      : `nothing matches '${q}' — the map covers code structure, not comments or strings`;
    viz.appendChild(capEl);
    for (const h of hits) {
      const row = document.createElement("div");
      row.className = "hit";
      row.innerHTML = `<span class="sc">${h.score}</span>` +
        `<span class="nm ${kindClass(h.kind)}">${esc(h.name)}</span>` +
        `<span class="pt">${esc(h.path)}:${h.line}</span>` +
        `<span class="mt">${esc((h.meta || "").split("\n")[0])}</span>`;
      row.addEventListener("click", () => run("what", `${h.path}::${h.name}`));
      viz.appendChild(row);
    }
    show("viz");
  }

  // ── the ask loop ────────────────────────────────────────────────────
  async function run(v, arg) {
    setActive(v);
    $("#arg").value = arg;
    // every view is a link: #radius/infra.tf::DB_URL — share it, bookmark it
    history.replaceState(null, "", `#${v}${arg ? "/" + encodeURIComponent(arg) : ""}`);
    if (v === "what" && arg) {
      await drawCard(arg);
      return;
    }
    if (v === "map") {
      drawMap(await api("/api/graph"));
      show("viz");
      return;
    }
    if (v === "handlers") {
      drawHandlers(await api("/api/handlers"));
      show("viz");
      return;
    }
    if (v === "radius" && arg) {
      await runRadius(arg, "in");
      return;
    }
    const data = await api(`/api/verb?v=${encodeURIComponent(v)}&arg=${encodeURIComponent(arg)}`);
    $("#out").innerHTML = linkify(esc(data.text));
    show("out");
  }

  async function loadTree() {
    const data = await api("/api/tree");
    $("#stats").textContent =
      `${data.stats.files} files · ${data.stats.entities} entities · ${data.stats.edges} edges`;
    const rail = $("#rail");
    rail.innerHTML = "";
    for (const f of data.files) {
      const d = document.createElement("details");
      d.className = "file";
      const s = document.createElement("summary");
      s.textContent = f.path;
      d.appendChild(s);
      for (const e of f.entities) {
        const row = document.createElement("div");
        row.className = "ent";
        row.innerHTML = `<span class="${kindClass(e.kind)}">${esc(e.name)}</span>` +
          `<span class="kind">${esc(e.kind)}</span>`;
        row.addEventListener("click", () => run("what", `${f.path}::${e.name}`));
        d.appendChild(row);
      }
      rail.appendChild(d);
    }
  }

  $("#tabs").addEventListener("click", (ev) => {
    const b = ev.target.closest("button");
    if (!b) return;
    const v = b.dataset.v;
    if (v === "map" || v === "changed" || v === "handlers") run(v, "");
    else if ($("#arg").value.trim()) run(v, $("#arg").value.trim());
    else { setActive(v); $("#arg").focus(); }
  });
  $("#cog").addEventListener("click", () => {
    document.querySelectorAll("#tabs button").forEach((b) => b.classList.remove("active"));
    $("#cog").classList.add("active");
    drawSettings();
    show("viz");
  });
  $("#run").addEventListener("click", () => {
    const q = $("#arg").value.trim();
    if (q) doSearch(q);
  });
  $("#arg").addEventListener("keydown", (ev) => {
    if (ev.key !== "Enter") return;
    const q = $("#arg").value.trim();
    if (!q) return;
    // Enter searches; a verb tab click runs that verb on the text instead
    if (q.includes("::")) run("what", q);
    else doSearch(q);
  });
  $("#out").addEventListener("click", (ev) => {
    const l = ev.target.closest(".lnk");
    if (l) run("what", `${l.dataset.path}::${l.dataset.name.replace(/&lt;|&gt;/g, "")}`);
  });
  window.addEventListener("focus", loadTree);

  applySettings();
  const [linkVerb, ...linkArg] = location.hash.slice(1).split("/");
  const linked = ["what", "who", "radius", "changed", "locate", "map", "handlers"].includes(linkVerb);
  loadTree().then(() => linked ? run(linkVerb, decodeURIComponent(linkArg.join("/")))
                               : run("map", ""));
</script>
</body>
</html>
